[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-workflow-backend"
version = "0.1.0"
description = "Backend for the AI Clinical Workflow Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

