[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-workflow-backend"
version = "0.1.0"
description = "Backend for the AI Clinical Workflow Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=1.2.9,<1.3",
    "langsmith>=0.10.10,<0.11",
    "pydantic-settings>=2.7,<3",
    "pypdf>=6.14.2,<7",
    "uvicorn[standard]>=0.34,<1",
    "weaviate-client>=4.22,<5",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pre-commit>=4.6,<5",
    "pytest>=8.3,<10",
    "ruff>=0.15.22,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
